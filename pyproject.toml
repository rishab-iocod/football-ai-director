[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cam-director"
version = "0.1.0"
description = "AI Sports Broadcast Director & High-Recall Ball Telemetry Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.scripts]
cam-director-bench = "scripts.bench_ball_tracker:main"
